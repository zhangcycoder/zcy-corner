<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#0b0c0f"/>
  <g font-family="SFMono-Regular, ui-monospace, Consolas, monospace" fill="#97999f" font-size="26">
    <text x="90" y="120">2 → tanh(10) → sigmoid</text>
    <text x="90" y="640" fill="#7188ff">real backprop · no library</text>
  </g>
  <!-- 网络图:2 输入 → 隐藏层 → 1 输出 -->
  <g stroke="#7188ff" stroke-width="1.1" opacity=".38">
    <line x1="180" y1="300" x2="430" y2="200"/><line x1="180" y1="300" x2="430" y2="280"/><line x1="180" y1="300" x2="430" y2="360"/><line x1="180" y1="300" x2="430" y2="440"/><line x1="180" y1="300" x2="430" y2="520"/>
    <line x1="180" y1="440" x2="430" y2="200"/><line x1="180" y1="440" x2="430" y2="280"/><line x1="180" y1="440" x2="430" y2="360"/><line x1="180" y1="440" x2="430" y2="440"/><line x1="180" y1="440" x2="430" y2="520"/>
    <line x1="430" y1="200" x2="660" y2="360"/><line x1="430" y1="280" x2="660" y2="360"/><line x1="430" y1="360" x2="660" y2="360"/><line x1="430" y1="440" x2="660" y2="360"/><line x1="430" y1="520" x2="660" y2="360"/>
  </g>
  <g fill="#15171c" stroke="#7188ff" stroke-width="1.6">
