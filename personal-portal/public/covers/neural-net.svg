    <circle cx="430" cy="200" r="14"/><circle cx="430" cy="280" r="14"/><circle cx="430" cy="360" r="14"/><circle cx="430" cy="440" r="14"/><circle cx="430" cy="520" r="14"/>
  </g>
  <circle cx="660" cy="360" r="20" fill="#7188ff"/>
  <!-- 决策边界母题:内圈类别 A,外环类别 B -->
  <g transform="translate(970 360)">
    <circle r="185" fill="none" stroke="#282a2f" stroke-width="1.2"/>
    <circle r="120" fill="#7188ff" opacity=".16"/>
    <circle r="120" fill="none" stroke="#7188ff" stroke-width="2" stroke-dasharray="6 7"/>
    <g fill="#7188ff">
      <circle cx="-30" cy="10" r="7"/><circle cx="35" cy="-25" r="7"/><circle cx="10" cy="55" r="7"/><circle cx="-55" cy="-40" r="7"/><circle cx="60" cy="40" r="7"/>
    </g>
    <g fill="#f0f0ec">
      <circle cx="-150" cy="-30" r="7"/><circle cx="140" cy="60" r="7"/><circle cx="-70" cy="150" r="7"/><circle cx="120" cy="-130" r="7"/><circle cx="10" cy="-165" r="7"/><circle cx="-160" cy="70" r="7"/>
    </g>
